[project]
name = "agent-anatomy"
version = "0.1.0"
description = "A Kiro-CLI-inspired coding agent, small enough to read. Educational; not affiliated with AWS."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Frank S (typex1)" }]
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.53.0",
    "ddgs>=9.15.0",
    "rich>=13.0.0",
    "mcp>=1.29.0",
]

[project.scripts]
agent = "agent_anatomy.cli:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
